[project]
name = "z-iris"
version = "0.1.0"
description = "Menubar notifier for Zulip with custom sounds"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rose Hooper" }]
requires-python = ">=3.11"
classifiers = [
    "Operating System :: MacOS",
    "Environment :: MacOS X",
    "Topic :: Communications :: Chat",
]

[project.urls]
Homepage = "https://github.com/rhooper/z-iris"
Issues = "https://github.com/rhooper/z-iris/issues"
dependencies = [
    "zulip>=0.9.0",
    "rumps>=0.4.0",
    "tomlkit>=0.15.1",
    "emoji>=2.16.0",
    "desktop-notifier>=6.2.0",
]

[project.scripts]
z-iris = "z_iris.__main__:main"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/z_iris"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
