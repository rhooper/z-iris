# Copy to ~/.config/z-iris/config.toml

[[server]]
name = "work"
zuliprc = "~/.zuliprc"
# Percent, scales every sound from this server. Optional.
# volume = 100

[defaults]
# A sound name: a bundled tone (chime, ping, bell, blip, knock, double, triple,
# rise, fall, alert, urgent, low, soft), a file you added in the editor, or "none".
sound = "chime"
# Percent of the system output level, 0 to 100.
volume = 60
# Percent, scales everything. Optional.
# master_volume = 100
# Phase 1 notifies for DMs and mentions. Set true to also notify for every
# unmuted channel message, which is noisy on a busy server.
notify_channel_messages = false

[output]
player = ["play", "-q"]

# Rules. The most specific matching rule wins: topic, keyword, mention (@you),
# wildcard (@all and friends), alert_word, channel, group_dm, dm. A higher
# "priority" (default 0) overrides that order, and ties go to file order. Only
# name and match are always required (channel, topic and keyword rules also need
# their own field). A silent rule still lets a personal @-mention through.
#   sound:  a sound name (see [defaults]) or "none"
#   volume: 0 to 100, before the server and master scaling
#   banner: "full", "title" (no message text) or "off"
#   server: limit the rule to one [[server]] name
#
# [[rule]]
# name = "outage"
# match = "keyword"
# keyword = '\b(outage|sev[12])\b'   # regular expression, case-insensitive
# sound = "~/Sounds/klaxon.wav"
# volume = 90
#
# [[rule]]
# name = "ops deploys"
# match = "topic"
# channel = "ops"                       # optional
# topic = "^deploy"                     # regular expression
# banner = "title"
#
# [[rule]]
# name = "bots"
# match = "channel"
# channel = "ci-bots"
# sound = "none"
# banner = "off"
