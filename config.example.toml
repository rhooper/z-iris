# Copy to ~/.config/z-iris/config.toml

[[server]]
name = "work"
zuliprc = "~/.zuliprc"
# Percent, scales every sound from this server. Optional.
# volume = 100

[defaults]
# A sound name: a bundled tone, a file you added in the editor, or "none".
# Tones: chime, ping, bell, blip, knock, double, triple, rise, fall, alert,
# urgent, low, soft, mid-short, mid-long; DX7-style FM dx-epiano, dx-bells,
# dx-vibe, dx-organ and more; moog-a (Minimoog A4); sos (Morse, spark-gap);
# three each after famous synths: juno-*, tb303-*, prophet-*, obx-*, cs80-*,
# ppg-*, d50-*, m1-*, alpha-*, odyssey-*, mellotron-*, fairlight-*,
# jupiter-*, sh101-*, emulator-*, jp8000-*, synclavier-*, buchla-*, omnichord-*;
# recordings doorbell, rooster, foghorn and more. The editor lists all.
sound = "chime"
# Percent of the system output level, 0 to 100.
volume = 60
# Percent, scales everything. Optional.
# master_volume = 100
# By default only DMs and mentions notify. Set true to also notify for every
# unmuted channel message, which is noisy on a busy server.
notify_channel_messages = false
# Hold a burst of messages for this many seconds into one summary banner, and
# have Apple's on-device model rewrite it as one sentence. Optional.
# batch_window = 60
# summarize = true
# Topics you post in (or are mentioned in) are joined: their messages alert
# until the topic has been quiet this many hours. Reactions to your messages
# show a quiet banner. A joined topic's alerts past group_after become one.
# join_on_mention = true
# joined_hours = 48
# reactions = true
# group_after = 3

[output]
# Fetch notification images from hosts other than your Zulip server. Off by
# default: the sender of a message could learn your IP address and when you are
# online. Server uploads, server avatars and Gravatar always work.
# external_images = false

# Rules. The most specific matching rule wins: topic, keyword, mention (@you),
# wildcard (@all and friends), alert_word, channel, group_dm, dm. A higher
# "priority" (default 0) overrides that order, and ties go to file order (the
# editor saves rules sorted by priority, then description). Only match is
# required (channel, topic and keyword rules also need their own field). A silent
# rule still lets a personal @-mention through.
#   description: optional; shown in the editor and logs (older configs: name)
#   channel: a channel name or a list of them; each is a regular expression for
#            the whole name, case-insensitive: "ops" is exactly #ops, "ops-.*" a family
#   sound:  a sound name (see [defaults]) or "none"
#   volume: 0 to 100, times the master volume
#   banner: "full", "title" (no message text) or "off"
#   sticky: true keeps the notification on screen until you read the message
#           (shown by z-iris-priority.app; also settable in [defaults])
#   stay:   seconds to keep it on screen (1 to 3600), then it goes; also by
#           z-iris-priority.app. macOS banners otherwise fade after ~5 s
#   server: limit the rule to one [[server]] name
#   join:   true makes a matching message join its topic
#
# Two kinds never compete with the rules above: "conversation" settings are
# layered on top for topics you joined, and "reaction" rules (optionally
# limited by emoji names) decide how reactions to your messages notify. A
# channel, topic or conversation rule may carry [rule.reaction] settings for
# reactions in its channels.
#
# [[rule]]
# description = "outage"
# match = "keyword"
# keyword = '\b(outage|sev[12])\b'   # regular expression, case-insensitive
# sound = "urgent"
# volume = 90
#
# [[rule]]
# description = "ops deploys"
# match = "topic"
# channel = ["ops", "infra-.*"]         # optional; names or patterns
# topic = "^deploy"                     # regular expression
# banner = "title"
#
# [[rule]]
# description = "bots"
# match = "channel"
# channel = "ci-bots"
# sound = "none"
# banner = "off"
#
# [[rule]]
# description = "python conversations"
# match = "conversation"
# channel = "python"
# sticky = false                        # fade instead of staying until read
#
# [[rule]]
# description = "celebrations"
# match = "reaction"
# emoji = ["tada", "heart"]
# sound = "rise"
#
# [[rule]]
# match = "channel"
# channel = "releases"
# join = true                           # every message here joins its topic
# sound = "ping"
#
# [rule.reaction]                       # reactions to your messages in #releases
# sound = "soft"
# volume = 40
